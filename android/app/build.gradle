plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.infinityclicker'
    compileSdk 35
    defaultConfig {
        applicationId 'app.infinityclicker'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug { debuggable true }
        // Release intentionally has no embedded or temporary signing credentials.
        // Configure a persistent, privately stored release keystore before distribution.
        release {
            minifyEnabled false
        }
    }
}
