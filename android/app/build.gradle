plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.infinityclicker'
    compileSdk 35
    defaultConfig {
        applicationId 'app.infinityclicker'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_FILE') ?: 'ci-release.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'temporary-build-only'
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'infinity-clicker'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'temporary-build-only'
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
