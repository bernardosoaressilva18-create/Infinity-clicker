plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.infinityclicker'
    compileSdk 35
    defaultConfig {
        applicationId 'app.infinityclicker'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
