<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a28"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/game-cover.jpg"><title>Infinity Clicker</title>
<style>
:root{--ink:#101a28;--panel:#1b2b3c;--panel2:#263b4e;--edge:#52697b;--cream:#fff0c5;--gold:#ffc857;--green:#7ee081;--blue:#73d7ff;--muted:#a9bdc9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,Arial,sans-serif;background:#0c1722;color:var(--cream);image-rendering:pixelated}button{font:inherit;color:inherit;cursor:pointer;border:2px solid #617b8b;border-radius:4px;background:linear-gradient(#385168,#26394c);box-shadow:0 3px 0 #0a111b;padding:8px 10px;font-weight:800}button:active{transform:translateY(2px);box-shadow:0 1px 0 #0a111b}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.game{height:100dvh;display:grid;grid-template-rows:54px minmax(0,1fr) 42px;gap:7px;padding:8px;max-width:1400px;margin:auto}.top{display:flex;align-items:center;gap:12px;min-width:0}.logo{font-size:clamp(15px,2.3vw,25px);font-weight:1000;letter-spacing:.04em;white-space:nowrap;text-shadow:2px 2px #000}.logo span{color:var(--gold)}.resources{display:flex;gap:7px;flex:1;justify-content:center;min-width:0}.resource{background:#172635;border:2px solid #435a6c;padding:5px 12px;min-width:100px;text-align:center;box-shadow:inset 0 -3px #0a121a}.resource small{display:block;font-size:10px;color:var(--muted);font-weight:800}.resource strong{font-size:clamp(13px,2vw,19px);color:#fff}.top button{white-space:nowrap}.main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.9fr);gap:8px;min-height:0}.scene{position:relative;min-width:0;min-height:0;overflow:hidden;border:3px solid #526d64;box-shadow:inset 0 0 0 3px #182d2a;background:#397d43;isolation:isolate}.sky{position:absolute;inset:0 0 48%;background:linear-gradient(#172b3b 0%,#325b62 75%,#8bbd79 76%,#8bbd79 100%);z-index:-3}.grass{position:absolute;inset:48% 0 0;background-color:#4b984b;background-image:linear-gradient(90deg,#ffffff08 2px,transparent 2px),linear-gradient(#102f2118 2px,transparent 2px),linear-gradient(135deg,#65ad4b 25%,transparent 25%),linear-gradient(315deg,#327f42 25%,transparent 25%);background-size:34px 30px,34px 30px,68px 60px,68px 60px;z-index:-2}.ground-patch{position:absolute;width:45%;height:32%;left:27%;bottom:5%;border:3px solid #b6df6d;border-radius:50%;background:#75b74d;box-shadow:inset 0 -10px #397d3c;z-index:-1}.tree{position:absolute;bottom:47%;width:46px;height:74px;background:#66452c;clip-path:polygon(40% 0,65% 0,65% 55%,100% 55%,100% 72%,65% 72%,65% 100%,35% 100%,35% 72%,0 72%,0 55%,35% 55%);filter:drop-shadow(3px 3px #14271b)}.tree:before{content:"";position:absolute;width:62px;height:42px;left:-8px;top:-12px;background:#2d7040;border:3px solid #6bb35a;clip-path:polygon(25% 0,75% 0,100% 35%,85% 100%,15% 100%,0 35%)}.tree.t1{left:8%;transform:scale(.8)}.tree.t2{right:9%;transform:scale(1.15)}.scene-label{position:absolute;top:12px;left:13px;font-size:12px;color:#d7edcf;font-weight:900;text-shadow:2px 2px #152b2a}.scene-energy{position:absolute;top:10%;left:0;right:0;text-align:center;font-size:clamp(24px,4vw,44px);font-weight:1000;color:#fff5c7;text-shadow:3px 3px #253a35,0 0 12px #ffe18a}.scene-energy small{display:block;font-size:11px;letter-spacing:.18em;color:#d9edc9}.button-zone{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);width:clamp(145px,24vw,245px);height:clamp(115px,20vw,180px);display:grid;place-items:center}.click-button{width:100%;height:100%;padding:0;border:0;background:transparent;box-shadow:none;filter:drop-shadow(0 10px 0 #182b24);transition:filter .1s}.click-button:active{transform:translateY(7px) scale(.98);filter:drop-shadow(0 3px 0 #182b24)}.click-button svg{width:100%;height:100%;overflow:visible;image-rendering:auto}.click-button:focus-visible{outline:3px solid var(--gold)}.helper{position:absolute;width:24px;height:24px;border:2px solid #c8f7ff;border-radius:5px;background:linear-gradient(135deg,#fff,#70ddff 55%,#3574bb);box-shadow:0 0 0 3px #263c48,0 0 14px #8ceeff;z-index:5;animation:fly 5s linear infinite}.helper:before,.helper:after{content:"";position:absolute;top:6px;width:8px;height:5px;border:1px solid #d6faff;border-radius:50%}.helper:before{left:-8px}.helper:after{right:-8px}.helper i{position:absolute;left:9px;bottom:-8px;width:3px;height:9px;background:#c8f7ff;opacity:0}.helper.clicking i{opacity:1}.helper.clicking{animation:tap .24s ease-in-out}.helper.h1{left:15%;top:58%;animation-delay:-1s}.helper.h2{right:15%;top:68%;animation-delay:-3s}.helper.h3{left:25%;top:25%;animation-delay:-2s}@keyframes fly{0%,100%{translate:0 0}25%{translate:18px -10px}50%{translate:4px 14px}75%{translate:-14px 3px}}@keyframes tap{50%{translate:0 14px;scale:.85}}.click-hint{position:absolute;top:67%;left:0;right:0;text-align:center;font-size:clamp(10px,1.5vw,14px);font-weight:1000;text-shadow:2px 2px #24422a}.chests{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:center;gap:12px}.chest{width:min(28%,170px);min-width:104px;display:flex;align-items:center;gap:7px;justify-content:center;background:#203749eF;border-color:#a2b78b;padding:7px}.chest-icon{font-size:25px;filter:drop-shadow(2px 2px #000)}.chest span:last-child{display:flex;flex-direction:column;align-items:flex-start;font-size:11px;line-height:1.1}.chest small{color:#c8d8d4;font-size:10px;margin-top:4px}.side{min-height:0;overflow:hidden;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:7px;background:#182737;border:3px solid #425b6b;padding:8px}.side-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.side-head h2{font-size:15px;margin:0}.tabs{display:flex;gap:5px}.tabs button{flex:1;padding:7px 4px;font-size:11px}.tabs button.active{background:linear-gradient(#b88738,#775022);border-color:#ffdb7b;color:#fff8d8}.content{min-height:0;overflow:auto;display:grid;align-content:start;gap:7px;padding-right:2px}.upgrade{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;text-align:left;width:100%;padding:8px;background:#263d4e}.upgrade .ico{font-size:24px;text-align:center}.upgrade strong{display:block;font-size:12px}.upgrade small{display:block;color:#b6cbd3;font-size:10px;margin-top:3px}.cost{color:#ffe08a;font-size:11px;white-space:nowrap}.item{display:flex;align-items:center;gap:8px;border:2px solid #536a79;background:#203342;padding:7px;font-size:11px}.item .item-icon{font-size:24px}.item .item-info{flex:1}.item small{display:block;color:#afc4ce;margin-top:2px}.rarity-common{border-color:#8599a4}.rarity-rare{border-color:#62b9ff}.rarity-epic{border-color:#c08bff}.rarity-legendary{border-color:#ffcf57}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;color:#a8c0c8;font-size:11px}.bottom .notice{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.bottom button{padding:5px 9px;font-size:11px}.float-text{position:absolute;z-index:10;pointer-events:none;color:#fff4a6;font-size:19px;font-weight:1000;text-shadow:2px 2px #28432d;animation:rise .8s forwards}@keyframes rise{to{transform:translateY(-45px);opacity:0}}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#07101bd9;display:grid;place-items:center;padding:18px}.modal{width:min(520px,95vw);max-height:88dvh;overflow:auto;border:3px solid #778d98;background:#1a2b3a;box-shadow:0 8px 0 #070d14;padding:16px}.modal h2{margin:0 0 10px;font-size:20px}.modal p{color:#c4d4d7;font-size:13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.loot{font-size:48px;text-align:center;margin:14px}.rotate-note{display:none}
@media(orientation:portrait){.rotate-note{position:fixed;inset:0;z-index:99;background:#111f2d;color:#fff0c5;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:900;font-size:22px}.game{visibility:hidden}}
@media(max-height:520px){.game{grid-template-rows:43px minmax(0,1fr) 28px;padding:5px;gap:5px}.main{grid-template-columns:minmax(0,1.65fr) minmax(245px,.9fr);gap:5px}.side{padding:6px;gap:5px}.resource{padding:3px 8px;min-width:78px}.scene-energy{top:5%}.button-zone{top:45%;width:clamp(135px,20vw,190px);height:clamp(100px,16vw,140px)}.click-hint{top:66%}.chests{bottom:5%}.chest{min-height:49px;padding:4px}.upgrade{padding:5px}.upgrade .ico{font-size:19px}.tabs button{padding:5px 3px}.bottom{font-size:10px}}
</style></head>
<body>
<div class="rotate-note">↻<br><br>Gire o celular para jogar na horizontal</div>
<div class="game">
<header class="top"><div class="logo">✦ INFINITY <span>CLICKER</span></div><div class="resources"><div class="resource"><small>ENERGIA</small><strong id="energy">0</strong></div><div class="resource"><small>POR CLIQUE</small><strong id="power">1</strong></div><div class="resource"><small>POR SEGUNDO</small><strong id="perSecond">0</strong></div></div><button id="saveBtn">💾 Salvar</button></header>
<main class="main">
<section class="scene" id="scene"><div class="sky"></div><div class="grass"></div><div class="ground-patch"></div><div class="tree t1"></div><div class="tree t2"></div><div class="scene-label">BOSQUE INFINITO · SETOR <b id="sector">01</b></div>
<div class="scene-energy" id="sceneEnergy">0<small>ENERGIA ACUMULADA</small></div>
<div class="button-zone"><button id="crystal" class="click-button" aria-label="Apertar o botão"><svg viewBox="0 0 220 170" aria-hidden="true"><defs><linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fa4350"/><stop offset=".48" stop-color="#b5162f"/><stop offset="1" stop-color="#5d1026"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff929b"/><stop offset=".2" stop-color="#ff3447"/><stop offset=".7" stop-color="#ed092c"/><stop offset="1" stop-color="#a70d2a"/></linearGradient></defs><ellipse cx="110" cy="145" rx="83" ry="13" fill="#14271e" opacity=".55"/><path d="M24 72 Q24 50 110 48 Q196 50 196 72 L196 107 Q196 134 110 139 Q24 134 24 107Z" fill="url(#side)" stroke="#71152b" stroke-width="3"/><ellipse cx="110" cy="73" rx="86" ry="42" fill="#781329"/><ellipse cx="110" cy="68" rx="86" ry="42" fill="url(#top)" stroke="#ff9aa4" stroke-width="4"/><ellipse cx="110" cy="66" rx="73" ry="32" fill="none" stroke="#ffb8be" stroke-opacity=".55" stroke-width="2"/><path d="M51 53 Q66 32 98 30" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="8" stroke-linecap="round"/><path d="M35 79 Q40 104 70 113" fill="none" stroke="#ff91a0" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/></svg></button></div>
<div id="helpers"><div class="helper h1"><i></i></div><div class="helper h2"><i></i></div><div class="helper h3 hidden"><i></i></div></div>
<div class="click-hint">CLIQUE NO BOTÃO · ENCHA O MEDIDOR PARA GANHAR BAÚS</div>
<div class="chests"><button class="chest" id="woodChest"><span class="chest-icon">🧰</span><span>BAÚ DA FLORESTA<small id="woodChestTimer">0/25 cliques</small></span></button><button class="chest" id="goldChest"><span class="chest-icon">🟨</span><span>BAÚ DOURADO<small id="goldChestTimer">0/100 cliques</small></span></button></div>
</section>
<aside class="side"><div class="side-head"><h2 id="panelTitle">⚒ LABORATÓRIO</h2><span id="level" style="font-size:11px;color:#a9bdc9">NÍVEL 1</span></div><nav class="tabs"><button class="active" data-tab="upgrades">MELHORIAS</button><button data-tab="inventory">ITENS <b id="itemCount">0</b></button><button data-tab="skills">HABILIDADES</button></nav><div id="content" class="content"></div><div class="side-head"><span id="rebirthText" style="font-size:10px;color:#b7c8d0">Renascimentos: 0 · bônus +0%</span><button id="rebirthBtn" style="background:linear-gradient(#d8a846,#875323);border-color:#ffe08a">♻ RENASCER</button></div></aside>
</main>
<footer class="bottom"><span id="status">Seu progresso é salvo neste aparelho.</span><span class="notice" id="notice"></span><button id="resetBtn">⚙</button></footer>
</div>
<div id="modalHost"></div>
<script>
const $=id=>document.getElementById(id);
const defaultPlayer=()=>({energy:0,lifetime:0,clickLevel:0,autoLevel:0,rebirths:0,clicks:0,woodProgress:0,goldProgress:0,items:[],skills:[],lastTick:Date.now()});
let player=loadPlayer(),tab='upgrades',busy=false,droneIndex=0;
function loadPlayer(){try{const p=JSON.parse(localStorage.getItem('ic_offline_player')||'null');return p?{...defaultPlayer(),...p,items:p.items||[],skills:p.skills||[]}:defaultPlayer()}catch{return defaultPlayer()}}
function save(){player.lastTick=Date.now();localStorage.setItem('ic_offline_player',JSON.stringify(player))}
function fmt(v){v=Math.floor(Number(v)||0);if(v<1000)return v.toLocaleString('pt-BR');const u=['K','M','B','T','Qa','Qi'];let i=-1;while(v>=1000&&i<u.length-1){v/=1000;i++}return v.toFixed(v<10?1:0)+u[i]}
function bonus(){return 1+player.rebirths*.25+(player.skills.includes('power')?.5:0)}
function power(){return Math.max(1,Math.floor((1+player.clickLevel)*bonus()*(1+player.items.filter(i=>i.type==='power').length*.15)))}
function perSecond(){return Math.floor(player.autoLevel*bonus()*(1+player.items.filter(i=>i.type==='auto').length*.1))}
function costs(){return {click:Math.floor(25*Math.pow(1.62,player.clickLevel)),auto:Math.floor(90*Math.pow(1.72,player.autoLevel)),helper:Math.floor(450*Math.pow(1.85,Math.max(0,player.autoLevel-1))),rebirth:Math.floor(10000*Math.pow(2,player.rebirths))}}
function notify(t){$('notice').textContent=t;setTimeout(()=>{if($('notice').textContent===t)$('notice').textContent=''},2600)}
function refresh(){const c=costs();$('energy').textContent=fmt(player.energy);$('power').textContent=fmt(power());$('perSecond').textContent=fmt(perSecond());$('sceneEnergy').innerHTML=fmt(player.energy)+'<small>ENERGIA ACUMULADA</small>';$('sector').textContent=String(1+Math.floor(Math.log10(Math.max(1,player.lifetime))/3)).padStart(2,'0');$('level').textContent='NÍVEL '+(1+Math.floor(Math.log10(Math.max(1,player.lifetime))/2));$('rebirthText').textContent='Renascimentos: '+player.rebirths+' · bônus +'+player.rebirths*25+'%';$('itemCount').textContent=player.items.length;$('woodChestTimer').textContent=player.woodProgress+'/25 cliques';$('goldChestTimer').textContent=player.goldProgress+'/100 cliques';document.querySelectorAll('.helper').forEach((el,i)=>el.classList.toggle('hidden',i>=Math.min(3,Math.floor(player.autoLevel/2)+1)));renderTab();save()}
function addEnergy(n){n=Math.max(0,Math.floor(n));player.energy+=n;player.lifetime+=n}
function clickButton(ev){if(busy)return;const n=power();addEnergy(n);player.clicks++;player.woodProgress++;player.goldProgress++;if(player.woodProgress>=25){player.woodProgress-=25;player.energy+=Math.max(20,n*12);player.lifetime+=Math.max(20,n*12);notify('Baú da floresta encontrado! Energia extra.')}if(player.goldProgress>=100){player.goldProgress-=100;openLoot('gold')}const r=$('scene').getBoundingClientRect(),f=document.createElement('span');f.className='float-text';f.textContent='+'+fmt(n);f.style.left=((ev.clientX||r.left+r.width/2)-r.left)+'px';f.style.top=((ev.clientY||r.top+r.height/2)-r.top)+'px';$('scene').appendChild(f);setTimeout(()=>f.remove(),850);refresh()}
$('crystal').addEventListener('click',clickButton);
const lootPool=[{name:'Folha vibrante',icon:'🍃',rarity:'common',type:'power',desc:'+15% energia por clique'},{name:'Pedra lunar',icon:'🌙',rarity:'rare',type:'auto',desc:'+10% energia automática'},{name:'Cristal arcano',icon:'💎',rarity:'epic',type:'power',desc:'+15% energia por clique'},{name:'Coroa dourada',icon:'👑',rarity:'legendary',type:'auto',desc:'+10% energia automática'},{name:'Cogumelo solar',icon:'🍄',rarity:'common',type:'power',desc:'+15% energia por clique'},{name:'Estrela azul',icon:'⭐',rarity:'rare',type:'auto',desc:'+10% energia automática'}];
function openLoot(kind){const roll=Math.random(),rarity=roll>.96?'legendary':roll>.82?'epic':roll>.55?'rare':'common';const candidates=lootPool.filter(x=>x.rarity===rarity),item={...candidates[Math.floor(Math.random()*candidates.length)],id:Date.now()+Math.random()};player.items.push(item);const rewards=kind==='gold'?Math.max(100,power()*100+perSecond()*60):Math.max(25,power()*12+perSecond()*8);addEnergy(rewards);refresh();$('modalHost').innerHTML='<div class="modal-backdrop"><section class="modal"><h2>✦ BAÚ ABERTO!</h2><div class="loot">'+item.icon+'</div><h2 style="text-align:center;color:'+(rarity==='legendary'?'#ffcf57':rarity==='epic'?'#c08bff':rarity==='rare'?'#62b9ff':'#d6e5e8')+'">'+item.name+'</h2><p style="text-align:center">'+item.desc+'<br>Energia extra: +'+fmt(rewards)+' · Raridade: '+rarity.toUpperCase()+'</p><div class="modal-actions"><button id="lootOk">COLETAR</button></div></section></div>';$('lootOk').onclick=()=>{$('modalHost').innerHTML='';tab='inventory';setTab('inventory');refresh()};save()}
$('woodChest').onclick=()=>{if(player.woodProgress<25){notify('Continue clicando: '+player.woodProgress+'/25.');return}player.woodProgress-=25;openLoot('wood')};
$('goldChest').onclick=()=>{if(player.goldProgress<100){notify('Baú dourado: '+player.goldProgress+'/100 cliques.');return}player.goldProgress-=100;openLoot('gold')};
function renderTab(){const c=$('content');c.innerHTML='';if(tab==='upgrades'){const list=[['🖱','Núcleo aprimorado','Mais energia por clique','click',costs().click],['🤖','Drone coletor','Gera energia automaticamente','auto',costs().auto],['🛸','Drone avançado','Desbloqueia ajudantes visuais','helper',costs().helper]];list.forEach(([ico,name,desc,kind,cost])=>{const b=document.createElement('button');b.className='upgrade';b.innerHTML='<span class="ico">'+ico+'</span><span><strong>'+name+'</strong><small>'+desc+' · nível '+(kind==='click'?player.clickLevel:player.autoLevel)+'</small></span><span class="cost">'+fmt(cost)+' ⚡</span>';b.onclick=()=>buyUpgrade(kind);c.appendChild(b)});const tip=document.createElement('p');tip.style.cssText='font-size:11px;color:#9eb5c2;margin:4px';tip.textContent='Clique no botão para ganhar energia. A cada 25 cliques você recebe uma recompensa; o baú dourado abre a cada 100.';c.appendChild(tip)}else if(tab==='inventory'){if(!player.items.length){c.innerHTML='<p style="color:#b5c8d2;font-size:12px">Sua mochila está vazia. Clique no botão e abra baús para encontrar itens!</p>';return}player.items.forEach((it)=>{const el=document.createElement('div');el.className='item rarity-'+it.rarity;el.innerHTML='<span class="item-icon">'+it.icon+'</span><span class="item-info"><b>'+it.name+'</b><small>'+it.rarity.toUpperCase()+' · '+it.desc+'</small></span>';c.appendChild(el)});const merge=document.createElement('button');merge.textContent='🔧 COMBINAR 3 ITENS COMUNS';merge.onclick=mergeItems;c.appendChild(merge)}else{const skills=[['power','Toque poderoso','+50% energia por clique',1000],['fortune','Sorte do bosque','Baús dão +50% energia',2500],['automation','Rotina automática','+1 energia por segundo',5000]];skills.forEach(([id,name,desc,cost])=>{const b=document.createElement('button');b.className='upgrade';const owned=player.skills.includes(id);b.innerHTML='<span class="ico">'+(owned?'✅':'✨')+'</span><span><strong>'+name+'</strong><small>'+desc+'</small></span><span class="cost">'+(owned?'ADQUIRIDA':fmt(cost)+' ⚡')+'</span>';b.disabled=owned;b.onclick=()=>{if(player.energy<cost){notify('Energia insuficiente para essa habilidade.');return}player.energy-=cost;player.skills.push(id);if(id==='automation')player.autoLevel++;if(id==='fortune')player.fortune=true;refresh();notify('Habilidade desbloqueada!')};c.appendChild(b)})}}
function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('panelTitle').textContent=t==='upgrades'?'⚒ LABORATÓRIO':t==='inventory'?'🎒 MOCHILA':'✨ HABILIDADES';renderTab()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function buyUpgrade(kind){const c=costs(),cost=kind==='helper'?c.helper:c[kind];if(player.energy<cost){notify('Energia insuficiente. Continue clicando!');return}player.energy-=cost;if(kind==='click')player.clickLevel++;else if(kind==='auto')player.autoLevel++;else player.autoLevel+=2;refresh();notify('Melhoria comprada!')}
function mergeItems(){const common=player.items.filter(i=>i.rarity==='common');if(common.length<3){notify('Você precisa de 3 itens comuns para combinar.');return}const remove=new Set(common.slice(0,3).map(i=>i.id));player.items=player.items.filter(i=>!remove.has(i.id));player.items.push({...lootPool.find(i=>i.rarity==='rare'),id:Date.now()+Math.random()});refresh();notify('3 itens combinados em 1 item raro!')}
$('rebirthBtn').onclick=()=>{const c=costs().rebirth;if(player.energy<c){notify('Precisa de '+fmt(c)+' energia para renascer.');return}if(!confirm('Renascimento: reiniciar energia e melhorias em troca de +25% permanente?'))return;player.energy=0;player.clickLevel=0;player.autoLevel=0;player.rebirths++;player.skills=[];refresh();notify('Renascimento concluído! O botão mudou de cor.');const hue=(player.rebirths*47)%360;$('crystal').style.filter='hue-rotate('+hue+'deg) drop-shadow(0 10px 0 #182b24)'};
$('saveBtn').onclick=()=>{save();notify('Progresso salvo neste aparelho!')};
$('resetBtn').onclick=()=>{if(confirm('Quer reiniciar todo o progresso deste aparelho?')){player=defaultPlayer();save();refresh();notify('Progresso reiniciado.')}};
let last=Date.now();setInterval(()=>{const now=Date.now(),elapsed=Math.min(5,(now-last)/1000);last=now;const gain=perSecond()*elapsed;if(gain>0){addEnergy(gain);refresh();const hs=document.querySelectorAll('.helper:not(.hidden)');if(hs.length){const d=hs[droneIndex++%hs.length];d.classList.remove('clicking');void d.offsetWidth;d.classList.add('clicking');setTimeout(()=>d.classList.remove('clicking'),260)}}else save()},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('beforeunload',save);
(function offlineGain(){const now=Date.now(),elapsed=Math.min(3600,Math.max(0,(now-(player.lastTick||now))/1000));if(elapsed>5&&player.autoLevel){const gain=Math.floor(perSecond()*elapsed);addEnergy(gain);$('status').textContent='Bem-vindo de volta! +'+fmt(gain)+' energia offline.'}})();
refresh();
</script></body></html>
