<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#176d3d">
<title>Infinity Clicker — Clique para conquistar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game">
  <canvas id="map" aria-label="Mapa do mundo"></canvas><div class="shade"></div>
  <div class="hud money-card"><div class="money-caption">🪙 Moedas</div><div id="money" class="money-value">0</div><div id="runCoins" class="round-value">Rodada: 0</div></div>
  <div id="worldChip" class="world-chip"><span id="worldName">🌿 Campo de Grama</span><small id="worldStatus">Mundo 1 de 5</small></div>
  <div class="progress-wrap" aria-label="Progresso para o próximo mundo"><div class="progress-stars">✦</div><div class="progress-rail"><div id="progressFill" class="progress-fill"></div></div><div id="progressLabel" class="progress-label">Próximo mundo</div></div>
  <div class="center-stage" id="centerStage"><div class="button-group">
    <div class="pet" aria-label="Companheiro alado decorativo"><svg viewBox="0 0 90 90"><ellipse cx="24" cy="42" rx="22" ry="12" fill="#eefcff" stroke="#9cc6cf" stroke-width="2" transform="rotate(-28 24 42)"/><ellipse cx="66" cy="42" rx="22" ry="12" fill="#eefcff" stroke="#9cc6cf" stroke-width="2" transform="rotate(28 66 42)"/><path d="M7 37l14 7-13 4 12 6-15 2M83 37l-14 7 13 4-12 6 15 2" fill="#9dd7e8" stroke="#6baab9" stroke-width="1.5"/><ellipse cx="45" cy="49" rx="19" ry="21" fill="#fff0b9" stroke="#a77b43" stroke-width="2"/><circle cx="38" cy="45" r="3" fill="#172c40"/><circle cx="52" cy="45" r="3" fill="#172c40"/><path d="M41 53l4 4 4-4" fill="none" stroke="#c97b3a" stroke-width="2.5" stroke-linecap="round"/><path d="M34 29l-6-10 13 6 4-13 7 13 12-5-7 11" fill="#ffe57c" stroke="#ab7a24" stroke-width="2"/><path d="M36 68l-4 9 12-4 7 4-1-10" fill="#62aaf3" stroke="#396db0" stroke-width="2"/></svg></div><div class="pet-label">Companheiro +5%</div>
    <button id="bigButton" class="big-button" aria-label="Clicar para ganhar moedas"><span class="infinity-symbol" aria-hidden="true">∞</span></button><div id="clickGain" class="click-gain">x1 por clique</div>
  </div></div>
  <div id="floatLayer" class="float-layer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="hud bottom-left"><button id="worldButton" class="world-button">🌎 Trocar mundo</button><button id="saveButton" class="small-game-btn">💾 Salvar</button></div>
  <div class="hud bottom-right"><button id="upgradeButton" class="upgrade-button">Melhorias</button></div>
  <div id="shopBackdrop" class="modal-backdrop hidden"><section class="shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle"><div class="shop-header"><div id="shopTitle" class="shop-title">🛠️ Melhorias</div><button id="closeShop" class="close-btn" aria-label="Fechar melhorias">✕</button></div><div class="tabs" role="tablist"><button class="tab active" data-tab="click" role="tab" aria-selected="true">👆 Clique</button><button class="tab" data-tab="auto" role="tab" aria-selected="false">⚙️ Automáticas</button><button class="tab" data-tab="luck" role="tab" aria-selected="false">🍀 Sorte</button><button class="tab" data-tab="rebirth" role="tab" aria-selected="false">⭐ Renascimento</button></div><div id="shopContent" class="shop-content"></div><div class="shop-footer"><span id="shopWallet">🪙 0 moedas · ⭐ 0 estrelas</span><button id="resetButton" class="reset">Zerar tudo</button></div></section></div>
</div>
<script src="game.js" defer></script>
</body>
</html>
