name: Build Infinity Clicker APK
on:
  workflow_dispatch:
  push:
    branches: [feature/loot-system]
    paths:
      - 'public/**'
      - 'android/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Copy web game into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -R public/. android/app/src/main/assets/public/
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-clicker-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
