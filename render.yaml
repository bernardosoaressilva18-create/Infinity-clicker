databases:
  - name: infinity-clicker-db
    databaseName: infinity_clicker
    user: infinity_clicker_user
    plan: free

services:
  - type: web
    name: infinity-clicker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-clicker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true